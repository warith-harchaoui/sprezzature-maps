# `docker compose up` is the whole onboarding. The Dockerfile beside this file
# is a recipe; this is the way in — the port, the volume, the environment and
# the command, declared rather than reconstructed by the next reader from a
# `docker run` line in somebody's shell history.
#
#   docker compose up -d
#   curl -s localhost:8000/health
#   open http://localhost:8000/               # the gallery, served by the API
#   # and the MCP endpoint at http://localhost:8000/mcp, same port
#   docker compose run --rm api make-map choropleth --out /work/world.svg
#
# No model and no second container: the relief rasters and the boundaries ship
# inside the image, so nothing is downloaded at run time. One service, no
# profile, and saying so is part of the declaration.

services:
  api:
    build: .
    image: sprezzature-maps:local
    ports:
      - "8000:8000"
    environment:
      # Read by `sprezzature-maps-mcp` as its defaults. The command below
      # also passes them as flags, so the two say the same thing twice
      # rather than one of them being a dead key.
      SPREZZATURE_MAPS_HOST: "0.0.0.0"
      SPREZZATURE_MAPS_PORT: "8000"
    volumes:
      # The maps written out, and any data file fed in. Mounted rather than
      # copied so the container never holds the only copy.
      - ./work:/work
    working_dir: /work
    restart: unless-stopped
    # One worker, deliberately. Each generator module is imported once and
    # cached in `sys.modules`, and the relief raster is loaded with it; a
    # second worker does not share that cache, it pays for its own copy. The
    # symptom of getting this wrong is not an error — it is a container that
    # quietly uses several times the memory it needs.
    # `sprezzature-maps-mcp` serves the HTTP routes and `/mcp` from one app,
    # and runs uvicorn with a single worker itself.
    command:
      - sprezzature-maps-mcp
      - --host
      - 0.0.0.0
      - --port
      - "8000"
