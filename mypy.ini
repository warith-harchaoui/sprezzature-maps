# mypy.ini — the type half of this package's gate, the counterpart to ruff.
#
# Added 2026-10-02, a sweep behind the one that gave the other six packages
# their gate on the same day. This package was missed by it, and the miss cost
# the two defects the gate exists to catch: `mcp.py` defined `main` twice with
# different signatures (the missing-extra fallback took no argv, the real entry
# point did), and a prose comment in `scripts/make_situation_map.py` opened a
# line with `# type:`, which PEP 484 reserves for type comments — mypy read the
# sentence as an annotation and refused to parse the file at all, so nothing
# under scripts/ had ever been checked.
#
# Deliberately the same pragmatic settings as its siblings, not `--strict`:
# full signatures are required, third-party stubs are not.
[mypy]
python_version = 3.10
# The plotting and geodata paths lazily import heavy optional backends that are
# not in the light CI lane. Check the code's OWN annotations, not stubs.
ignore_missing_imports = True
warn_redundant_casts = True
# Every def carries a full signature — no untyped or partially-typed functions.
disallow_untyped_defs = True
disallow_incomplete_defs = True
# warn_unused_ignores stays OFF on purpose: with ignore_missing_imports,
# whether a `# type: ignore` on an optional-backend import is "used" depends on
# whether that dependency happens to be installed, so it fires falsely in CI
# while being correct in a dev environment where the backends are present.
#
# scripts/ is checked as its own invocation: the scripts add their own dir to
# sys.path at runtime and import siblings by bare name (`from _svg import …`),
# which only resolves when that directory is the check's root.

# cli_click.py carries the same two-branch dependency guard as mcp.py, but the
# asymmetry there is real and harmless: the fallback is a plain function while
# the live one is a click Group, and the console script calls both as `main()`.
# mypy types `main` from the first branch it sees and then rejects the
# `@main.command(...)` decorators below it. Unlike mcp.py's, this gap cannot
# reach a caller — no signature differs — so it is declared here rather than
# papered over with three inline ignores in the middle of the command table.
[mypy-sprezzature_maps.cli_click]
disable_error_code = attr-defined
