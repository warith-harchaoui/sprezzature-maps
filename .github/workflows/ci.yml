name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject says >=3.10. Testing only 3.12 hid a module that did
        # not parse on 3.10 or 3.11 at all -- PEP 701 f-strings, 3.12+
        # syntax -- for as long as it took someone to run it there.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # assets/geo/*.png, *.pdf, doc/img/*.png are Git LFS (see
          # .gitattributes) -- actions/checkout does not fetch LFS objects
          # by default, which leaves relief-lowres.png etc. as small pointer
          # stubs Pillow cannot decode. First CI run caught this for real.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The optional vector renderer. Without it every test of the PDF/EPS
      # path takes its "renderer absent" branch, which is the branch that
      # was already working -- CI would have been green on a feature it
      # never ran.
      # librsvg renders the vector pages; poppler rasterises one back so the
      # canary can check the words survived the trip. Without either, those
      # tests skip -- and a skipped canary is a canary nobody is watching.
      - name: Install the vector toolchain
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin poppler-utils

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # sprezzature-figures resolves from PyPI, like every other
          # dependency. This used to clone its GitHub HEAD and install that,
          # under a comment saying it was not published yet — true when
          # written, false since, and the workaround outlived it. The cost
          # was not the extra step: it meant CI tested against whatever that
          # repository's HEAD happened to be at the minute the job ran, so a
          # green build was not reproducible and a red one could appear with
          # no change here at all.
          pip install -e ".[dev,cli,api,mcp]" -r requirements-dev.txt

      - name: Lint
        run: ruff check sprezzature_maps scripts tests

      # The type half of the gate, which this repository was missing while
      # its six siblings got it. The miss was not free: mcp.py's two `main`
      # definitions took different arguments, and a prose comment opening a
      # line with `# type:` -- PEP 484's type-comment syntax -- made mypy
      # refuse to parse make_situation_map.py at all, so scripts/ had never
      # been checked. What it found once it could read them included the
      # river layer binding its stroke width to `width`, the canvas width
      # the legend is laid out from. Once, on one version: this is a gate,
      # not a matrix. scripts/ is a separate invocation because those
      # modules import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_maps
          mypy scripts

      # Serial, and it still has to be. `-n auto` was tried here once and the
      # runner killed the job at 27% with exit code 143 -- SIGTERM, the OOM
      # killer.
      #
      # Re-measured on 2026-10-16 with `ru_maxrss`, per process, because the
      # earlier figures mixed two different instruments and were not
      # comparable:
      #
      #   whole suite, serial ............... 8.12 GB
      #   each worker under `-n 4` .......... 7.5 - 7.9 GB
      #   one himalaya render, alone ........ 3.95 GB
      #
      # The per-worker figure is not caused by parallelism: a lone process
      # reaches the same place. It is a floor made of two parts, resident
      # caches (the elevation pyramid is 2.24 GB if every tier is touched,
      # plus the geo tables) and a transient render peak of about 4 GB on top
      # of them. A standard runner has 16 GB, so one process fits with room
      # and *two* would ask for about 16 -- there is still no worker count
      # between "serial" and "over the limit".
      #
      # What did change is the time. The plate cache in `tests/_plates.py`
      # draws each distinct situation map once per run and shares it across
      # workers on disk, which took the serial suite from 982 s to 540 s
      # locally -- the same tests, with the redundant redraws removed rather
      # than spread over more cores.
      #
      # Going parallel here is still blocked, and the lever is the ~8 GB
      # floor rather than any single call: capping the resident tier cache
      # and chunking the big render buffers would do it. Worth knowing before
      # anyone retries this knob. The pre-push hook does pass `-n auto`,
      # because a developer machine has the memory a runner does not; same
      # tests either way.
      - name: Tests
        run: python -m pytest -q

      # Every module, not a hand-written list. This list and the pre-push
      # hook's had already drifted apart by a file, which is the whole
      # failure mode: a worked example in a docstring nobody runs.
      - name: Doctests (scripts/)
        run: |
          for f in scripts/*.py; do
            python -m doctest "$f"
          done
