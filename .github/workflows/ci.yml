name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject says >=3.10. Testing only 3.12 hid a module that did
        # not parse on 3.10 or 3.11 at all -- PEP 701 f-strings, 3.12+
        # syntax -- for as long as it took someone to run it there.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # assets/geo/*.png, *.pdf, doc/img/*.png are Git LFS (see
          # .gitattributes) -- actions/checkout does not fetch LFS objects
          # by default, which leaves relief-lowres.png etc. as small pointer
          # stubs Pillow cannot decode. First CI run caught this for real.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # sprezzature-figures resolves from PyPI, like every other
          # dependency. This used to clone its GitHub HEAD and install that,
          # under a comment saying it was not published yet — true when
          # written, false since, and the workaround outlived it. The cost
          # was not the extra step: it meant CI tested against whatever that
          # repository's HEAD happened to be at the minute the job ran, so a
          # green build was not reproducible and a red one could appear with
          # no change here at all.
          pip install -e ".[dev,cli,api,mcp]"

      - name: Lint
        run: ruff check sprezzature_maps scripts tests

      # The type half of the gate, which this repository was missing while
      # its six siblings got it. The miss was not free: mcp.py's two `main`
      # definitions took different arguments, and a prose comment opening a
      # line with `# type:` -- PEP 484's type-comment syntax -- made mypy
      # refuse to parse make_situation_map.py at all, so scripts/ had never
      # been checked. What it found once it could read them included the
      # river layer binding its stroke width to `width`, the canvas width
      # the legend is laid out from. Once, on one version: this is a gate,
      # not a matrix. scripts/ is a separate invocation because those
      # modules import siblings by bare name off a runtime sys.path.
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: |
          mypy sprezzature_maps
          mypy scripts

      - name: Tests
        run: python -m pytest -q

      - name: Doctests (scripts/)
        run: |
          for f in scripts/_geo_colors.py scripts/_relief.py scripts/_svg.py scripts/_render.py scripts/_interactive.py scripts/make_choropleth.py scripts/make_situation_map.py; do
            python -m doctest "$f"
          done
