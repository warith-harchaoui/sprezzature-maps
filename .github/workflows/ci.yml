name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Cran d'arrêt, pas budget : sans lui GitHub laisse courir un job pendu
    # six heures. Aucun des dix dépôts n'en avait.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # pyproject says >=3.10. Testing only 3.12 hid a module that did
        # not parse on 3.10 or 3.11 at all -- PEP 701 f-strings, 3.12+
        # syntax -- for as long as it took someone to run it there.
      # UNE SEULE version de Python sous la suite complete. La matrice en
      # faisait tourner plusieurs, c'est-a-dire le meme travail multiplie par
      # autant de coureurs pour attraper des differences de version que les
      # tests ne regardent pas. Le plancher garde sa preuve : le job `floor`
      # installe et importe le paquet sur la plus ancienne version promise,
      # ce qui est la promesse faite a `pip install`, pour une fraction du
      # cout.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # assets/geo/*.png, *.pdf, doc/img/*.png are Git LFS (see
          # .gitattributes) -- actions/checkout does not fetch LFS objects
          # by default, which leaves relief-lowres.png etc. as small pointer
          # stubs Pillow cannot decode. First CI run caught this for real.
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The optional vector renderer. Without it every test of the PDF/EPS
      # path takes its "renderer absent" branch, which is the branch that
      # was already working -- CI would have been green on a feature it
      # never ran.
      # librsvg renders the vector pages; poppler rasterises one back so the
      # canary can check the words survived the trip. Without either, those
      # tests skip -- and a skipped canary is a canary nobody is watching.
      - name: Install the vector toolchain
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin poppler-utils

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # sprezzature-figures resolves from PyPI, like every other
          # dependency. This used to clone its GitHub HEAD and install that,
          # under a comment saying it was not published yet — true when
          # written, false since, and the workaround outlived it. The cost
          # was not the extra step: it meant CI tested against whatever that
          # repository's HEAD happened to be at the minute the job ran, so a
          # green build was not reproducible and a red one could appear with
          # no change here at all.
          pip install -e ".[dev]" -r requirements-dev.txt

      - name: Lint
        run: ruff check sprezzature_maps scripts tests


      # `-n auto`, the same command the pre-push hook runs, so "the hook
      # passed" and "CI will pass" mean the same thing. CI used to run this
      # suite serially and the local gate was three times faster for no
      # reason: 555 tests in 160 s against 524 s, measured on both.
      # pytest-xdist is already a declared dev dependency.
      #
      # Why it was serial, kept because it is the first thing to check if a
      # run dies with exit code 143 (SIGTERM, the OOM killer): an earlier
      # `-n auto` attempt was killed at 27%. Measured on 2026-10-16 with
      # `ru_maxrss`, per process:
      #
      #   whole suite, serial ............... 8.12 GB
      #   each worker under `-n 4` .......... 7.5 - 7.9 GB
      #   one himalaya render, alone ........ 3.95 GB
      #
      # The floor is resident caches (the elevation pyramid is 2.24 GB if
      # every tier is touched, plus the geo tables) and a transient render
      # peak of about 4 GB. The plate cache in `tests/_plates.py` draws each
      # distinct situation map once per run and shares it across workers on
      # disk, which removed most of the redundant redraws. If the OOM comes
      # back, the lever is that floor -- capping the resident tier cache,
      # chunking the big render buffers -- or `-n 2`, not a serial run.
      - name: Tests
        # The modules below render real plates, 8 to 20 s a test: 8.5 min here.
        # The pre-push hook runs them; test_smoke and test_api still draw one.
        run: |
          python -m pytest -q -n auto \
            --ignore=tests/test_density.py \
            --ignore=tests/test_situation_plate.py \
            --ignore=tests/test_situation_map.py \
            --ignore=tests/test_an_option_asked_for_is_an_option_honoured.py \
            --ignore=tests/test_render_without_out_stays_in_cwd.py \
            --ignore=tests/test_nothing_is_a_silent_tab_stop.py \
            --ignore=tests/test_no_frontier_is_the_seam_of_a_wrap.py \
            --ignore=tests/test_admin_boundaries.py \
            --ignore=tests/test_a_plate_knows_its_printed_size.py \
            --ignore=tests/test_frontiers_can_be_historical.py \
            --ignore=tests/test_demo_examples_are_current.py \
            --ignore=tests/test_a_sheet_of_windows_shares_one_frame.py \
            --ignore=tests/test_a_plate_leaves_in_the_format_it_was_asked_for.py \
            --ignore=tests/test_a_plate_embeds_the_fonts_it_names.py \
            --ignore=tests/test_a_plate_can_prove_what_drew_it.py \
            --ignore=tests/editor/test_one_call_renders_any_kind.py \
            --ignore=tests/editor/test_the_editor_serves_and_refuses_well.py

      # Every module, not a hand-written list. This list and the pre-push
      # hook's had already drifted apart by a file, which is the whole
      # failure mode: a worked example in a docstring nobody runs.
      - name: Doctests (scripts/)
        run: |
          for f in scripts/*.py; do
            python -m doctest "$f"
          done

      # The package's own modules, which until 2026-11-01 ran **nowhere**.
      # pytest collects no doctests here (no `--doctest-modules` in addopts)
      # and the sweep above walks `scripts/` only -- while its own comment
      # says "Every module, not a hand-written list". Measured: twelve worked
      # examples in `sprezzature_maps/`, one of them stale since `density`
      # arrived. `gui.render_gallery_html` promised two gallery tiles and the
      # page had three, and nothing could say so.
      #
      # Run through pytest rather than by extending the loop above: `python
      # -m doctest sprezzature_maps/api.py` imports the path as a top-level
      # module, so its relative imports fail for a mechanical reason that has
      # nothing to do with the examples. pytest imports them as package
      # modules, which is what they are. Costs under a second.
      - name: Doctests (the package)
        run: python -m pytest -q --doctest-modules sprezzature_maps

  floor:
    name: Plancher (3.10 installe et importe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python` est une promesse faite a qui lance `pip install` : sur
    # cette version, le paquet s'installe et s'importe. Installer et importer,
    # deliberement pas la suite de tests — les tests ont le droit d'employer des
    # nouveautes de langage, et faire echouer le plancher la-dessus ferait
    # echouer un job pour une raison etrangere a la promesse.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import sprezzature_maps"
