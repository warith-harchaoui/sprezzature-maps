[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-maps"
version = "0.1.0"
description = "Hand-authored SVG world maps for the sprezzature stack: choropleth and layered areas-of-control situation maps, no Vega, no matplotlib. Depends on sprezzature-figures for shared rendering primitives."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"},
]
keywords = ["maps", "choropleth", "situation-map", "geospatial", "svg", "hand-authored-svg", "sprezzature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "sprezzature-figures>=1.1.0",
    "resvg-py>=0.3",
    "pillow>=10.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyyaml>=6.0",
    # Used by scripts/_relief.py + make_choropleth.py's vectorised inverse
    # Equal Earth projection (Newton-Raphson over the whole pixel grid at
    # once) -- was an unlisted transitive dependency until this pass.
    "numpy>=1.24",
]

[project.optional-dependencies]
# Click twin of the always-installed argparse `make-map` CLI: adds CSV
# ingestion + role=column mapping, which the shared argparse render path
# (scripts/_render.py, byte-identical across the whole sprezzature-figures
# generator family) is not the place to special-case for just this repo.
cli = [
    "click>=8.1",
]
# HTTP surface (sprezzature_maps/api.py) -- also carries the GUI gallery
# page, served as static routes on the same FastAPI app.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface via fastapi-mcp (sprezzature_maps/mcp.py) -- mounts the
# FastAPI app as MCP tools so any MCP-aware host can call them directly.
mcp = [
    "fastapi-mcp>=0.3",
    # Same pin sprezzature-figures carries: fastapi-mcp 0.4.0 declares
    # mcp>=1.12.0 with no upper bound, but calls mcp's Server(...)
    # positionally -- mcp 2.0.0 made a parameter keyword-only, breaking
    # FastApiMCP(...) construction. Pin below 2.0 until fastapi-mcp fixes it.
    "mcp<2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
make-map = "sprezzature_maps.cli:main"
sprezzature-maps = "sprezzature_maps.cli_click:main"
sprezzature-maps-mcp = "sprezzature_maps.mcp:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-maps"

[tool.setuptools]
packages = [
    "sprezzature_maps",
    "sprezzature_maps_scripts",
]

[tool.setuptools.package-dir]
"sprezzature_maps_scripts" = "scripts"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (network/rasterization-heavy)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]
