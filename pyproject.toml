[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-maps"
version = "0.1.0"
description = "Hand-authored SVG world maps for the sprezzature stack: choropleth and layered areas-of-control situation maps, no Vega, no matplotlib. Depends on sprezzature-figures for shared rendering primitives."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"},
]
keywords = ["maps", "choropleth", "situation-map", "geospatial", "svg", "hand-authored-svg", "sprezzature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "sprezzature-figures>=1.1.0",
    "resvg-py>=0.3",
    "pillow>=10.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
make-map = "sprezzature_maps.cli:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-maps"

[tool.setuptools]
packages = [
    "sprezzature_maps",
    "sprezzature_maps_scripts",
]

[tool.setuptools.package-dir]
"sprezzature_maps_scripts" = "scripts"

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (network/rasterization-heavy)",
]
