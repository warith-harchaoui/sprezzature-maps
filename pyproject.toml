[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-maps"
version = "0.1.0"
description = "Hand-authored SVG world maps for the sprezzature stack: choropleth and layered areas-of-control situation maps, every line authored as SVG directly. Depends on sprezzature-figures for shared rendering primitives."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Warith HARCHAOUI", email = "warith.harchaoui@gmail.com"},
]
keywords = ["maps", "choropleth", "situation-map", "geospatial", "svg", "hand-authored-svg", "sprezzature"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # A PEP 508 direct reference stood here while sprezzature-figures was
    # only on GitHub. PyPI rejects those outright — "Can't have direct
    # dependency" — and now that figures is published there is no reason
    # for one.
    "sprezzature-figures>=2.0.0",
    "resvg-py>=0.3",
    "pillow>=10.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pyyaml>=6.0",
    # Used by scripts/_relief.py + make_choropleth.py's vectorised inverse
    # Equal Earth projection (Newton-Raphson over the whole pixel grid at
    # once) -- was an unlisted transitive dependency until this pass.
    "numpy>=1.24",
]

[project.optional-dependencies]
# Click twin of the always-installed argparse `make-map` CLI: adds CSV
# ingestion + role=column mapping, which the shared argparse render path
# (scripts/_render.py, byte-identical across the whole sprezzature-figures
# generator family) is not the place to special-case for just this repo.
cli = [
    "click>=8.1",
]
# HTTP surface (sprezzature_maps/api.py) -- also carries the GUI gallery
# page, served as static routes on the same FastAPI app.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# MCP surface via fastapi-mcp (sprezzature_maps/mcp.py) -- mounts the
# FastAPI app as MCP tools so any MCP-aware host can call them directly.
mcp = [
    "fastapi-mcp>=0.3",
    # Same pin sprezzature-figures carries: fastapi-mcp 0.4.0 declares
    # mcp>=1.12.0 with no upper bound, but calls mcp's Server(...)
    # positionally -- mcp 2.0.0 made a parameter keyword-only, breaking
    # FastApiMCP(...) construction. Pin below 2.0 until fastapi-mcp fixes it.
    "mcp<2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
make-map = "sprezzature_maps.cli:main"
sprezzature-maps = "sprezzature_maps.cli_click:main"
sprezzature-maps-mcp = "sprezzature_maps.mcp:main"

[project.urls]
Homepage = "https://harchaoui.org/warith/sprezzature/"
Repository = "https://github.com/warith-harchaoui/sprezzature-maps"

[tool.setuptools]
packages = [
    "sprezzature_maps",
    "sprezzature_maps_scripts",
    "sprezzature_maps_geo",
]

[tool.setuptools.package-dir]
"sprezzature_maps_scripts" = "scripts"
"sprezzature_maps_geo" = "assets/geo"

# Vector data, the low-res relief, and the coarse elevation tiers only.
# The fine tiers (elevation-30arcsec/1arcmin/2arcmin, 226MB + 64MB + 18MB)
# stay source-tree only; _relief.py degrades to the finest tier present.
[tool.setuptools.package-data]
"sprezzature_maps_geo" = [
    "*.json",
    "*.geojson",
    "relief-lowres.png",
    "elevation-16arcmin.png",
    "elevation-8arcmin.png",
    "elevation-4arcmin.png",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (network/rasterization-heavy)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
]
